name: Create Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  push:
    tags:
      - "v*.*.*"

jobs:
  create-release-tag:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'release-version') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}
      - name: Checkout code
        with:
          token: ${{ steps.app-token.outputs.token }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create tag
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION=$HEAD_REF
          VERSION=${VERSION#chore/release-version-}
          echo "Creating tag for version $VERSION"
          git tag "$VERSION"
          git push origin "$VERSION"

  create-release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Build
        run: ./gradlew build

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
          name: Release ${{ github.ref_name }}
          body: |
            Release version ${{ github.ref_name }} has been created.
          generate_release_notes: true
          files: fabric/build/libs/naturoforumsmp-*[0-9].jar

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          JAR="fabric/build/libs/naturoforumsmp-$VERSION.jar"
          MC_VERSION=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          # Project may be unlisted or draft, so resolve the slug with the token
          PROJECT_ID=$(curl -sf -H "Authorization: $MODRINTH_TOKEN" https://api.modrinth.com/v2/project/naturoforumsmp-mod | jq -r .id)
          CHANGELOG=$(gh release view "$TAG" --json body -q .body)

          jq -n \
            --arg project_id "$PROJECT_ID" \
            --arg version "$VERSION" \
            --arg mc "$MC_VERSION" \
            --arg changelog "$CHANGELOG" \
            '{
              project_id: $project_id,
              name: $version,
              version_number: $version,
              changelog: $changelog,
              version_type: "release",
              game_versions: [$mc],
              loaders: ["fabric"],
              featured: true,
              status: "listed",
              file_parts: ["jar"],
              primary_file: "jar",
              dependencies: [
                {project_id: "P7dR8mSH", dependency_type: "required"},
                {project_id: "lhGA9TYQ", dependency_type: "required"},
                {project_id: "9s6osm5g", dependency_type: "optional"},
                {project_id: "mOgUt4GM", dependency_type: "optional"}
              ]
            }' > modrinth.json

          curl -sSf -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: Profiidev/NaturoForumSMP-Mod" \
            -F "data=<modrinth.json;type=application/json" \
            -F "jar=@$JAR;type=application/java-archive"
